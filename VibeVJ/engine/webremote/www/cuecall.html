<!doctype html>

<body class="cc">
<!-- The cue call of the lighting desk (#719): engine/webremote/webremote.shio serves it, /api/cuecall the data. -->
<header class="cc-bar">
	<a class="btn mini" href="/" aria-label="Remote">‹</a>
	<div class="cc-track"><b id="cc-title">—</b><span id="cc-pos"></span></div>

<main id="cc-rows"></main>
