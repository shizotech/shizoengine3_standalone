<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cow Laying an Egg — Enhanced Surreal Experience</title>
  <style>
    :root {
      --neon-purple: #b026ff;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff00ff;
      --neon-yellow: #ffcc00;
      --neon-green: #00ff41;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      font-family: 'Segoe UI', 'Comic Sans MS', fantasy, sans-serif;
    }

    /* Surreal cosmic background */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: 
        radial-gradient(circle at 20% 30%, rgba(176, 38, 255, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 243, 255, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.3) 0%, transparent 60%),
        linear-gradient(135deg, #0a0014, #1a0024, #0d001a);
      animation: cosmicPulse 8s ease-in-out infinite alternate;
    }

    @keyframes cosmicPulse {
      0% { filter: hue-rotate(0deg) brightness(1); }
      100% { filter: hue-rotate(60deg) brightness(1.2); }
    }

    /* Floating particles */
    .floating-particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: var(--neon-cyan);
      border-radius: 50%;
      pointer-events: none;
      animation: floatUp 15s linear infinite;
      opacity: 0.7;
      z-index: -2;
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) translateX(0); opacity: 0; }
      25% { opacity: 0.8; }
      50% { opacity: 0.3; }
      75% { opacity: 0.6; }
      100% { transform: translateY(-20vh) translateX(50px); opacity: 0; }
    }

    /* Main container with glassmorphism */
    .main-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .scene {
      text-align: center;
      position: relative;
      width: 100%;
      max-width: 600px;
      padding: 40px;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border-radius: 30px;
      border: 2px solid var(--glass-border);
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 0 40px rgba(176, 38, 255, 0.1);
      animation: floatScene 6s ease-in-out infinite;
    }

    @keyframes floatScene {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(1deg); }
    }

    .cow-wrapper {
      position: relative;
      display: inline-block;
      margin: 40px 0;
      perspective: 1000px;
    }

    .cow {
      font-size: 120px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      border: none;
      background: transparent;
      padding: 0;
      display: inline-block;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 0 10px var(--neon-purple));
    }

    .cow:hover {
      transform: scale(1.2) rotate(-5deg);
      filter: drop-shadow(0 0 20px var(--neon-cyan)) drop-shadow(0 0 30px var(--neon-pink));
    }

    .cow:active {
      transform: scale(0.9) rotate(10deg);
    }

    .cow:focus-visible {
      outline: 3px solid var(--neon-yellow);
      outline-offset: 8px;
      border-radius: 20px;
    }

    .cow-spinning {
      animation: spinCow 2s linear infinite;
    }

    @keyframes spinCow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .cow-bouncing {
      animation: bounceCow 0.6s ease-in-out;
    }

    @keyframes bounceCow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-80px) scale(1.1); }
    }

    /* The egg */
    .egg {
      font-size: 60px;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translate(-50%, 0) scale(0);
      z-index: 10;
      transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      filter: drop-shadow(0 0 10px var(--neon-yellow));
    }

    .egg.laid {
      top: 200px;
      transform: translate(-50%, 0) scale(1);
      animation: eggLayPulse 0.8s ease-out, eggFloat 3s ease-in-out infinite;
    }

    @keyframes eggLayPulse {
      0% { transform: translate(-50%, 0) scale(0.5) rotate(0deg); }
      50% { transform: translate(-50%, 0) scale(1.3) rotate(180deg); }
      100% { transform: translate(-50%, 0) scale(1) rotate(360deg); }
    }

    @keyframes eggFloat {
      0%, 100% { transform: translate(-50%, 0) scale(1) rotate(0deg); }
      50% { transform: translate(-50%, -20px) scale(1.1) rotate(15deg); }
    }

    /* Egg variants */
    .egg--golden { filter: drop-shadow(0 0 15px gold) drop-shadow(0 0 25px #ffd700); }
    .egg--golden::before { content: "🥚"; }

    .egg--dino { filter: drop-shadow(0 0 15px lime) drop-shadow(0 0 25px #32cd32); }
    .egg--dino::before { content: "🦕"; }

    .egg--chicken { filter: drop-shadow(0 0 15px orange) drop-shadow(0 0 25px #ff8c00); }
    .egg--chicken::before { content: "🐥"; }

    .egg--quantum { filter: drop-shadow(0 0 15px cyan) drop-shadow(0 0 25px #00ffff); animation: quantumFlicker 0.2s infinite; }
    .egg--quantum::before { content: "⚛️"; }

    @keyframes quantumFlicker {
      0%, 100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      50% { opacity: 0.5; transform: translate(-50%, 0) scale(1.5); }
    }

    /* Controls */
    .instruction {
      margin: 30px 0 20px;
      font-size: 24px;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
      animation: textPulse 3s ease-in-out infinite;
    }

    @keyframes textPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3) drop-shadow(0 0 5px var(--neon-cyan)); }
    }

    .sound-toggle-btn,
    .secret-btn {
      margin: 15px 10px;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 2px solid var(--neon-cyan);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }

    .sound-toggle-btn::before,
    .secret-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: rotate(45deg);
      transition: all 0.5s;
      pointer-events: none;
    }

    .sound-toggle-btn:hover,
    .secret-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 5px 25px rgba(0, 243, 255, 0.5);
    }

    .sound-toggle-btn:hover::before,
    .secret-btn:hover::before {
      left: 100%;
    }

    .sound-toggle-btn:active,
    .secret-btn:active {
      transform: translateY(0);
    }

    .sound-toggle-btn:focus-visible,
    .secret-btn:focus-visible {
      outline: 3px solid var(--neon-yellow);
      outline-offset: 4px;
    }

    .secret-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 40px;
      padding: 20px;
      z-index: 100;
      border-color: var(--neon-green);
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
    }

    .secret-btn::before {
      content: "⚠️";
    }

    /* Hidden text reveal */
    .hidden-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px;
      color: rgba(255, 0, 0, 0.15);
      pointer-events: none;
      z-index: 0;
      white-space: nowrap;
      user-select: none;
      font-family: 'Courier New', monospace;
      animation: messageFade 2s ease-in-out;
    }

    @keyframes messageFade {
      0% { transform: translate(-50%, -50%) scale(0.5) rotate(-10deg); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 0.2; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(10deg); opacity: 0; }
    }

    /* Time warp effect */
    .time-warp {
      animation: timeWarpAnim 3s ease-in-out infinite;
    }

    @keyframes timeWarpAnim {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.8) blur(2px); }
    }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* Time control slider */
    .time-control-container {
      margin: 20px 0;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      text-align: center;
    }

    .time-control-label {
      color: var(--neon-cyan);
      margin-bottom: 10px;
      font-weight: bold;
    }

    .time-control {
      width: 200px;
      height: 10px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      outline: none;
    }

    .time-control::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--neon-yellow);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-yellow);
    }

    /* Time warp status */
    .time-warp-status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(255, 204, 0, 0.2);
      border: 1px solid var(--neon-yellow);
      border-radius: 10px;
      color: var(--neon-yellow);
      z-index: 900;
      display: none;
      animation: blinkStatus 1s infinite;
    }

    @keyframes blinkStatus {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Message log */
    .message-log {
      position: fixed;
      bottom: 100px;
      right: 20px;
      max-width: 300px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 800;
      text-align: right;
    }

    .log-entry {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 15px;
      margin-bottom: 8px;
      border-radius: 10px;
      border-left: 4px solid var(--neon-pink);
      color: #fff;
      font-size: 14px;
      animation: logSlideIn 0.3s ease-out;
    }

    @keyframes logSlideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Rainbow trail effect */
    .rainbow-trail {
      position: fixed;
      pointer-events: none;
      z-index: 950;
      font-size: 20px;
      animation: rainbowFade 1s linear;
    }

    @keyframes rainbowFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(2) translateY(-100px); }
    }

    /* Footer */
    .footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      animation: footerPulse 4s ease-in-out infinite;
    }

    @keyframes footerPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .scene {
        padding: 20px;
      }
      .cow {
        font-size: 80px;
      }
      .egg.laid {
        top: 180px;
      }
    }
  </style>
</head>
<body>
  <!-- Cosmic background -->
  <div class="cosmic-bg"></div>
  <canvas id="confetti-canvas"></canvas>

  <!-- Hidden messages -->
  <div class="hidden-message" id="hiddenMessage1">WHAT THE</div>
  <div class="hidden-message" id="hiddenMessage2">FUCK</div>
  <div class="hidden-message" id="hiddenMessage3">COW</div>
  <div class="hidden-message" id="hiddenMessage4">EGGS</div>

  <!-- Time warp indicator -->
  <div class="time-warp-status" id="timeWarpStatus">TIME WARP ACTIVE 🕒</div>

  <!-- Message log container -->
  <div class="message-log" id="messageLog"></div>

  <!-- Main container -->
  <div class="main-container">
    <div class="scene">
      <div class="cow-wrapper" id="cowWrapper">
        <button
          class="cow"
          id="cow"
          aria-label="Lay an egg"
          title="Click to make the cow lay an egg"
          data-delay="5000"
          data-aria-announce="An egg has landed!"
        >🐮</button>
      </div>

      <div
        class="egg"
        id="egg"
        data-egg-type="standard"
        aria-hidden="true"
      ></div>

      <div
        class="egg-label"
        id="eggLabel"
        aria-live="polite"
      >Ready to lay again...</div>

      <div class="instruction">✨ Click the cow to witness the impossible! ✨</div>

      <div class="time-control-container">
        <div class="time-control-label">⏱️ TIME WARP CONTROL</div>
        <input type="range" class="time-control" id="timeControl" min="0" max="100" value="50">
      </div>

      <div>
        <button
          class="sound-toggle-btn"
          id="soundToggle"
          data-sound-toggle="on"
          type="button"
        >🔊 Sound On</button>
        <button
          class="sound-toggle-btn"
          id="randomEmojis"
          type="button"
        >🌈 Random Emojis</button>
      </div>

      <div>
        <button
          class="sound-toggle-btn"
          id="spinCow"
          type="button"
        >🌀 Spin Cow</button>
        <button
          class="sound-toggle-btn"
          id="bouncingCow"
          type="button"
        >🚀 Bouncing Cow</button>
      </div>

      <div>
        <button
          class="sound-toggle-btn"
          id="timeWarp"
          type="button"
        >⏳ Time Warp</button>
        <button
          class="sound-toggle-btn"
          id="resetEffects"
          type="button"
        >🔄 Reset All</button>
      </div>
    </div>

    <div class="footer">
      <p>⚠️ Warning: May cause extreme confusion and "what the fuck" reactions</p>
      <p>💡 Pro tip: Try clicking rapidly or holding Shift while clicking</p>
    </div>
  </div>

  <!-- Secret button (appears after achievements) -->
  <button class="secret-btn" id="secretBtn" aria-label="Secret button" title="I'm hidden"></button>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    // ════════════════════════════════════════════
    //  Cow Egg Easter Egg Simulator - Enhanced
    // ════════════════════════════════════════════

    const CowEggSimEnhanced = {
      cow: null,
      egg: null,
      eggLabel: null,
      soundToggleBtn: null,
      delay: 5000,
      soundEnabled: true,
      ariaMessage: "An egg has landed!",
      eggType: "standard",
      cowWrapper: null,
      cowState: {
        spinning: false,
        bouncing: false,
        timeWarp: false,
        timeWarpFactor: 1,
        clickCount: 0,
        shiftClickCount: 0,
        achievements: new Set()
      },

      // Sound engine
      audioContext: null,
      lastPitch: 1200,
      pitchModulation: 0,

      init() {
        this.cow = document.getElementById('cow');
        this.egg = document.getElementById('egg');
        this.eggLabel = document.getElementById('eggLabel');
        this.soundToggleBtn = document.getElementById('soundToggle');
        this.cowWrapper = document.getElementById('cowWrapper');
        
        if (!this.cow || !this.egg) {
          console.error('Elements not found');
          return;
        }
        
        this.delay = this.parseDelay();
        this.soundEnabled = this.parseSoundToggle();
        this.ariaMessage = this.cow.dataset.ariaAnnounce || "An egg has landed!";
        this.eggType = this.egg.dataset.eggType || "standard";
        
        this.applyEggVariant();
        this.initListeners();
        this.initTimeControl();
        this.initRandomEmojis();
        this.initSpinCow();
        this.initBouncingCow();
        this.initTimeWarp();
        this.initSecretButton();
        this.initHiddenMessages();
        this.createFloatingParticles();
        
        this.log("✨ Cow Egg Simulator Enhanced v2.0 loaded!");
        this.log("🚀 Prepare for the impossible!");
        
        // Initial confetti burst
        this.triggerConfetti(100);
      },

      log(message) {
        const logContainer = document.getElementById('messageLog');
        if (logContainer) {
          const entry = document.createElement('div');
          entry.className = 'log-entry';
          entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
          logContainer.appendChild(entry);
          logContainer.scrollTop = logContainer.scrollHeight;
          
          // Keep only last 10 entries
          if (logContainer.children.length > 10) {
            logContainer.removeChild(logContainer.firstChild);
          }
        }
      },

      // ════════════════════════════════════════════
      //  Core Functions
      // ════════════════════════════════════════════

      parseDelay() {
        const val = this.cow.dataset.delay;
        const parsed = parseInt(val, 10);
        return isNaN(parsed) || parsed < 1000 ? 5000 : parsed;
      },

      parseSoundToggle() {
        const val = this.soundToggleBtn.dataset.soundToggle;
        return val !== 'off';
      },

      applyEggVariant() {
        ['egg--golden', 'egg--dino', 'egg--chicken', 'egg--quantum', 'egg--standard'].forEach(cls => {
          this.egg.classList.remove(cls);
        });
        if (this.eggType !== 'standard') {
          this.egg.classList.add(`egg--${this.eggType}`);
        }
      },

      play() {
        if (this.soundEnabled) this.playBeep();
        
        // Random egg variant
        const variants = ['standard', 'golden', 'dino', 'chicken', 'quantum'];
        this.eggType = variants[Math.floor(Math.random() * variants.length)];
        this.applyEggVariant();
        
        this.egg.classList.add('laid');
        this.eggLabel.classList.add('visible');
        
        // Randomize message
        const messages = [
          "An egg has landed!",
          "The cow defies physics!",
          "Quantum egg created!",
          "Eggsplosive moment!",
          "Eggceptional!",
          "What the...?!",
          "Mooooooment of truth!"
        ];
        this.eggLabel.textContent = messages[Math.floor(Math.random() * messages.length)];
        
        // Confetti burst
        this.triggerConfetti(150);
        
        // Time warp effect on lay
        if (this.cowState.timeWarp) {
          document.body.classList.add('time-warp');
        }

        setTimeout(() => this.reset(), this.delay);
      },

      reset() {
        this.egg.classList.remove('laid');
        this.eggLabel.classList.remove('visible');
        this.eggLabel.textContent = 'Ready to lay again...';
        
        // Reset time warp
        if (this.cowState.timeWarp) {
          document.body.classList.remove('time-warp');
        }
      },

      toggleSound() {
        this.soundEnabled = !this.soundEnabled;
        this.soundToggleBtn.dataset.soundToggle = this.soundEnabled ? 'on' : 'off';
        this.soundToggleBtn.textContent = this.soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
        this.soundToggleBtn.focus();
        this.log(this.soundEnabled ? "🔊 Sound enabled" : "🔇 Sound disabled");
      },

      playBeep() {
        try {
          if (!this.audioContext) {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          
          const ctx = this.audioContext;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.type = 'sine';
          
          // Modulate pitch based on click count and time warp
          let baseFreq = 1200;
          if (this.cowState.timeWarp) {
            baseFreq *= this.cowState.timeWarpFactor;
          }
          this.lastPitch = baseFreq + (Math.random() * 400 - 200) + this.pitchModulation;
          
          osc.frequency.setValueAtTime(this.lastPitch, ctx.currentTime);
          
          // Pitch modulation effect
          osc.frequency.exponentialRampToValueAtTime(this.lastPitch * 1.5, ctx.currentTime + 0.1);
          
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
          
          // Random pitch for next beep
          this.pitchModulation = Math.random() * 200 - 100;
        } catch (e) {
          // Silent fail
        }
      },

      triggerConfetti(amount = 100) {
        const duration = 1500;
        const end = Date.now() + duration;

        const frame = () => {
          if (Date.now() > end) return;
          
          confetti({
            particleCount: amount / 20,
            angle: 60,
            spread: 70,
            origin: { x: 0 },
            colors: ['#b026ff', '#00f3ff', '#ff00ff', '#ffcc00', '#00ff41']
          });
          
          confetti({
            particleCount: amount / 20,
            angle: 120,
            spread: 70,
            origin: { x: 1 },
            colors: ['#b026ff', '#00f3ff', '#ff00ff', '#ffcc00', '#00ff41']
          });
          
          requestAnimationFrame(frame);
        };
        
        frame();
      },

      // ════════════════════════════════════════════
      //  Easter Eggs - Absurd Features
      // ════════════════════════════════════════════

      initListeners() {
        // Regular click
        this.cow.addEventListener('click', (e) => {
          this.cowState.clickCount++;
          this.cowState.shiftClickCount = 0; // Reset shift count on normal click
          
          // Achievement check
          if (this.cowState.clickCount === 10) {
            this.log("🏆 Achievement: 10 clicks! The cow is getting tired...");
            this.eggType = 'chicken';
            this.applyEggVariant();
            this.triggerConfetti(300);
          } else if (this.cowState.clickCount === 50) {
            this.log("🏆 Achievement: 50 clicks! You're obsessed!");
            this.playBeep(); // Double beep
            setTimeout(() => this.playBeep(), 100);
            this.cowWrapper.style.transform = 'rotate(360deg)';
            setTimeout(() => this.cowWrapper.style.transform = 'none', 1000);
          } else if (this.cowState.clickCount === 100) {
            this.log("🏆 Achievement: 100 clicks! UNREAL!");
            this.cow.textContent = "🤯";
            this.cowState.achievements.add("100_CLIKS");
          }
          
          this.play();
        });

        // Shift+Click for secret behavior
        this.cow.addEventListener('keydown', (e) => {
          if (e.shiftKey) {
            this.cowState.shiftClickCount++;
          }
        });

        this.cow.addEventListener('click', (e) => {
          if (e.shiftKey) {
            this.cowState.shiftClickCount++;
            
            if (this.cowState.shiftClickCount === 3) {
              this.log("🤫 SECRET MODE: SHIFT+CLICK ACTIVATED!");
              document.body.classList.toggle('dark-mode');
              this.triggerConfetti(500);
            } else if (this.cowState.shiftClickCount === 7) {
              this.log("🤫 SHIFT+CLICK 7 times! WAVE YOUR MOUSE!");
              this.createRainbowTrail(e.clientX, e.clientY);
            }
          }
        });

        // Double click
        this.cow.addEventListener('dblclick', () => {
          this.log("⚡ DOUBLE CLICK! TIME WARP!");
          this.cowState.timeWarp = !this.cowState.timeWarp;
          this.showTimeWarpStatus(this.cowState.timeWarp);
          this.triggerConfetti(200);
        });

        // Triple click (3 clicks within 500ms)
        let clickTimes = [];
        this.cow.addEventListener('click', () => {
          const now = Date.now();
          clickTimes = clickTimes.filter(time => now - time < 500);
          clickTimes.push(now);
          
          if (clickTimes.length === 3) {
            this.log("🔥 TRIPLE CLICK! Chaos mode activated!");
            this.cow.textContent = "🤪";
            this.playBeep();
            setTimeout(() => {
              this.playBeep();
              setTimeout(() => this.playBeep(), 100);
            }, 100);
            this.triggerConfetti(400);
            setTimeout(() => {
              this.cow.textContent = "🐮";
            }, 2000);
          }
        });

        this.soundToggleBtn.addEventListener('click', () => this.toggleSound());
      },

      // Easter Egg 1: Random Emojis
      initRandomEmojis() {
        const btn = document.getElementById('randomEmojis');
        if (!btn) return;
        
        const emojis = ['🐮', '🥚', '🐔', '🦕', '👽', '🦄', '🐲', '🌟', '⚡', '🌀', '🌈', '🔥', '💎'];
        
        btn.addEventListener('click', () => {
          this.log("🌈 Random emojis incoming!");
          this.triggerConfetti(150);
          
          // Create floating emojis
          for (let i = 0; i < 20; i++) {
            setTimeout(() => {
              const el = document.createElement('div');
              el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
              el.className = 'rainbow-trail';
              el.style.left = Math.random() * 100 + 'vw';
              el.style.top = '100vh';
              el.style.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
              document.body.appendChild(el);
              setTimeout(() => el.remove(), 1000);
            }, i * 100);
          }
          
          // Random cow emoji change
          this.cow.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          setTimeout(() => this.cow.textContent = "🐮", 2000);
          
          this.playBeep();
        });
      },

      // Easter Egg 2: Spin Cow
      initSpinCow() {
        const btn = document.getElementById('spinCow');
        if (!btn) return;
        
        btn.addEventListener('click', () => {
          this.log("🌀 Spin mode activated!");
          this.triggerConfetti(50);
          
          if (this.cowState.spinning) {
            this.cow.classList.remove('cow-spinning');
            this.cowState.spinning = false;
            btn.textContent = '🌀 Spin Cow';
          } else {
            this.cow.classList.add('cow-spinning');
            this.cowState.spinning = true;
            btn.textContent = '🛑 Stop Spin';
          }
        });
      },

      // Easter Egg 3: Bouncing Cow
      initBouncingCow() {
        const btn = document.getElementById('bouncingCow');
        if (!btn) return;
        
        btn.addEventListener('click', () => {
          this.log("🚀 Bouncing mode activated!");
          this.triggerConfetti(50);
          
          if (this.cowState.bouncing) {
            this.cow.classList.remove('cow-bouncing');
            this.cowState.bouncing = false;
            btn.textContent = '🚀 Bouncing Cow';
          } else {
            this.cow.classList.add('cow-bouncing');
            this.cowState.bouncing = true;
            btn.textContent = '🛑 Stop Bounce';
          }
        });
      },

      // Easter Egg 4: Time Warp
      initTimeControl() {
        const slider = document.getElementById('timeControl');
        if (!slider) return;
        
        slider.addEventListener('input', (e) => {
          const value = parseInt(e.target.value, 10);
          this.cowState.timeWarpFactor = 0.1 + (value / 50);
          
          if (this.cowState.timeWarp) {
            this.log(`⏳ Time warp factor: ${this.cowState.timeWarpFactor.toFixed(2)}x`);
          }
        });
      },

      initTimeWarp() {
        const btn = document.getElementById('timeWarp');
        if (!btn) return;
        
        btn.addEventListener('click', () => {
          this.cowState.timeWarp = !this.cowState.timeWarp;
          this.showTimeWarpStatus(this.cowState.timeWarp);
          
          if (this.cowState.timeWarp) {
            this.log("⏳ Time Warp: ACTIVE! The fabric of time is unstable.");
            document.body.classList.add('time-warp');
          } else {
            this.log("⏳ Time Warp: DEACTIVATED. Time returns to normal.");
            document.body.classList.remove('time-warp');
          }
          
          this.triggerConfetti(200);
        });
      },

      showTimeWarpStatus(active) {
        const status = document.getElementById('timeWarpStatus');
        if (status) {
          status.style.display = active ? 'block' : 'none';
        }
      },

      // Easter Egg 5: Hidden Messages
      initHiddenMessages() {
        const messages = ['hiddenMessage1', 'hiddenMessage2', 'hiddenMessage3', 'hiddenMessage4'];
        
        this.cow.addEventListener('click', (e) => {
          if (this.cowState.clickCount > 5 && Math.random() > 0.7) {
            const msgIndex = Math.floor(Math.random() * messages.length);
            const msg = document.getElementById(messages[msgIndex]);
            if (msg) {
              msg.style.display = 'block';
              msg.style.opacity = '0.15';
              
              setTimeout(() => {
                msg.style.opacity = '0';
                msg.style.display = 'none';
              }, 2000);
            }
          }
        });
      },

      // Easter Egg 6: Secret Button
      initSecretButton() {
        const btn = document.getElementById('secretBtn');
        if (!btn) return;
        
        // Secret button appears after 25 clicks
        this.cow.addEventListener('click', () => {
          if (this.cowState.clickCount === 25) {
            btn.style.display = 'block';
            this.log("🤫 Secret button revealed at 25 clicks!");
            this.triggerConfetti(100);
          }
        });
        
        btn.addEventListener('click', () => {
          this.log("⚠️ SECRET BUTTON PRESSED! Reality bending...");
          this.triggerConfetti(800);
          
          // Invert colors
          document.body.style.filter = 'invert(1)';
          setTimeout(() => {
            document.body.style.filter = 'none';
            this.triggerConfetti(600);
            this.cow.textContent = "👁️";
            setTimeout(() => this.cow.textContent = "🐮", 1000);
          }, 500);
          
          // Floating cow
          this.cowWrapper.style.animation = 'floatScene 3s ease-in-out infinite';
        });
      },

      // Easter Egg 7: Rainbow Trail
      createRainbowTrail(x, y) {
        for (let i = 0; i < 30; i++) {
          const el = document.createElement('div');
          el.textContent = ['🌈', '✨', '💫', '⭐'][Math.floor(Math.random() * 4)];
          el.className = 'rainbow-trail';
          el.style.left = (x + (Math.random() * 100 - 50)) + 'px';
          el.style.top = (y + (Math.random() * 100 - 50)) + 'px';
          el.style.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1000);
        }
      },

      // Easter Egg 8: Floating Particles
      createFloatingParticles() {
        for (let i = 0; i < 50; i++) {
          const particle = document.createElement('div');
          particle.className = 'floating-particle';
          particle.style.left = Math.random() * 100 + 'vw';
          particle.style.animationDuration = (10 + Math.random() * 20) + 's';
          particle.style.animationDelay = (Math.random() * 5) + 's';
          particle.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
          document.body.appendChild(particle);
        }
      },

      // Easter Egg 9: Reset All
      initResetEffects() {
        const btn = document.getElementById('resetEffects');
        if (!btn) return;
        
        btn.addEventListener('click', () => {
          this.log("🔄 Resetting all effects...");
          
          // Reset cow
          this.cow.classList.remove('cow-spinning', 'cow-bouncing');
          this.cow.textContent = "🐮";
          this.cowWrapper.style.transform = 'none';
          this.cowWrapper.style.animation = 'floatScene 6s ease-in-out infinite';
          
          // Reset states
          this.cowState.spinning = false;
          this.cowState.bouncing = false;
          this.cowState.timeWarp = false;
          this.cowState.clickCount = 0;
          this.cowState.shiftClickCount = 0;
          
          // Reset UI
          this.egg.classList.remove('laid');
          this.eggLabel.classList.remove('visible');
          document.body.classList.remove('time-warp');
          document.getElementById('timeWarpStatus').style.display = 'none';
          
          // Reset buttons
          document.getElementById('spinCow').textContent = '🌀 Spin Cow';
          document.getElementById('bouncingCow').textContent = '🚀 Bouncing Cow';
          document.getElementById('secretBtn').style.display = 'none';
          document.getElementById('timeControl').value = 50;
          
          // Reset filters
          document.body.style.filter = 'none';
          
          this.triggerConfetti(100);
          this.log("✅ All effects reset! The cow is ready again.");
        });
      }
    };

    // ════════════════════════════════════════════
    //  Initialize
    // ════════════════════════════════════════════

    document.addEventListener('DOMContentLoaded', () => {
      CowEggSimEnhanced.init();
      CowEggSimEnhanced.initResetEffects();
    });

    // Global access for console fun
    window.CowEggSimEnhanced = CowEggSimEnhanced;
  </script>
</body>
</html>
