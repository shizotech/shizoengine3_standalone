<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Features • ShizoGPT Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   <link rel="stylesheet" href="style.css" />
   <link rel="stylesheet" href="../components/ui.css" />
   <link rel="stylesheet" href="../components/theme.css" />
</head>
<body>
  <div class="features-container">
    <!-- Header -->
    <div class="features-header">
      <div class="header-content">
        <h1 class="features-title">
          <i class="fa-solid fa-rocket"></i>
          Feature Tracker
        </h1>
        <div class="features-meta">
          <span class="feature-count" id="featureCount">0</span> features tracked
        </div>
      </div>
      
      <div class="header-actions">
        <button class="ui-btn ui-btn-secondary" id="btnFilter">
          <i class="fa-solid fa-filter"></i>
          Filter
        </button>
        <button class="ui-btn" id="btnAddFeature">
          <i class="fa-solid fa-plus"></i>
          Add Feature
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="features-filters">
      <div class="filter-group">
        <label>Status</label>
        <div class="filter-chips" id="statusFilter">
          <button class="ui-filter-chip active" data-status="all">
            <i class="fa-solid fa-list ui-filter-chip-icon"></i>
            All
          </button>
          <button class="ui-filter-chip" data-status="planned">
            <i class="fa-solid fa-calendar ui-filter-chip-icon"></i>
            Planned
          </button>
          <button class="ui-filter-chip" data-status="in-progress">
            <i class="fa-solid fa-code ui-filter-chip-icon"></i>
            In Progress
          </button>
          <button class="ui-filter-chip" data-status="completed">
            <i class="fa-solid fa-check ui-filter-chip-icon"></i>
            Completed
          </button>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Priority</label>
        <div class="filter-chips" id="priorityFilter">
          <button class="ui-filter-chip active" data-priority="all">
            <i class="fa-solid fa-list ui-filter-chip-icon"></i>
            All
          </button>
          <button class="ui-filter-chip" data-priority="low">
            <i class="fa-solid fa-circle ui-filter-chip-icon"></i>
            Low
          </button>
          <button class="ui-filter-chip" data-priority="medium">
            <i class="fa-solid fa-dot-circle ui-filter-chip-icon"></i>
            Medium
          </button>
          <button class="ui-filter-chip" data-priority="high">
            <i class="fa-solid fa-circle-exclamation ui-filter-chip-icon"></i>
            High
          </button>
          <button class="ui-filter-chip" data-priority="critical">
            <i class="fa-solid fa-triangle-exclamation ui-filter-chip-icon"></i>
            Critical
          </button>
        </div>
      </div>
    </div>

    <!-- Feature Grid -->
    <div class="feature-grid ui-grid" id="featureGrid">
      <!-- Features will be rendered here -->
    </div>

    <!-- Empty State -->
    <div class="empty-state ui-empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon"><i class="fa-solid fa-rocket"></i></div>
      <h2 class="empty-state-title">No Features Found</h2>
      <p class="empty-state-desc">Get started by adding your first feature. Track its progress from planning to completion.</p>
    </div>

    <!-- Add Feature Modal -->
    <div id="addFeatureModal" class="ui-modal-overlay" style="display: none;">
      <div class="ui-modal">
        <div class="ui-modal-header">
          <span class="ui-modal-title">Add New Feature</span>
          <button class="ui-modal-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="ui-modal-body">
          <form class="ui-form" id="addFeatureForm">
            <div class="ui-form-group">
              <label class="ui-form-label">Feature Title</label>
              <input type="text" class="ui-form-input" id="featureTitle" placeholder="Brief, descriptive title" required />
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">Description</label>
              <textarea class="ui-form-input ui-form-textarea" id="featureDescription" placeholder="Detailed description of the feature..." rows="4"></textarea>
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">Priority</label>
              <select class="ui-form-select" id="featurePriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">Category</label>
              <select class="ui-form-select" id="featureCategory">
                <option value="ui">User Interface</option>
                <option value="api">API</option>
                <option value="performance">Performance</option>
                <option value="security">Security</option>
                <option value="feature">New Feature</option>
                <option value="bugfix">Bugfix</option>
              </select>
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">Target Date</label>
              <input type="date" class="ui-form-input" id="featureTargetDate" />
            </div>
          </div>
        </div>
        <div class="ui-modal-footer">
          <button class="ui-btn ui-btn-secondary" data-modal-action="cancel">Cancel</button>
          <button class="ui-btn" id="btnSubmitFeature">Add Feature</button>
        </div>
      </div>
    </div>

    <!-- Feature Details Modal -->
    <div id="featureDetailsModal" class="ui-modal-overlay" style="display: none;">
      <div class="ui-modal" style="max-width: 600px;">
        <div class="ui-modal-header">
          <span class="ui-modal-title">Feature Details</span>
          <button class="ui-modal-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="ui-modal-body" id="featureDetailsContent">
          <!-- Feature details will be rendered here -->
        </div>
        <div class="ui-modal-footer">
          <button class="ui-btn ui-btn-danger" id="btnDeleteFeature">
            <i class="fa-solid fa-trash"></i>
            Delete
          </button>
          <button class="ui-btn ui-btn-secondary" id="btnCloseFeatureDetails">Close</button>
        </div>
      </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmDeleteModal" class="ui-modal-overlay" style="display: none;">
      <div class="ui-modal">
        <div class="ui-modal-header">
          <span class="ui-modal-title">Confirm Delete</span>
          <button class="ui-modal-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="ui-modal-body">
          <p>Are you sure you want to delete this item? This action cannot be undone.</p>
        </div>
        <div class="ui-modal-footer">
          <button class="ui-btn ui-btn-secondary" id="btnCancelDelete">Cancel</button>
          <button class="ui-btn ui-btn-danger" id="btnConfirmDelete">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../components/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
