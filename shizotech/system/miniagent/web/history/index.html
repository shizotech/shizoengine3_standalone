<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History • ShizoGPT Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../components/ui.css" />
  <link rel="stylesheet" href="../components/theme.css" />
</head>
<body>
  <div class="history-container">
    <!-- Header -->
    <div class="history-header">
      <div class="header-content">
        <h1 class="history-title">
          <i class="fa-solid fa-clock-rotate-left"></i>
          Action History
        </h1>
        <div class="history-meta">
          <span class="history-count" id="historyCount">0</span> actions tracked
        </div>
      </div>
      
      <div class="header-actions">
        <button class="ui-btn ui-btn-secondary" id="btnFilter">
          <i class="fa-solid fa-filter"></i>
          Filter
        </button>
        <button class="ui-btn ui-btn-secondary" id="btnClearHistory">
          <i class="fa-solid fa-trash"></i>
          Clear
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="history-filters">
      <div class="filter-group">
        <label>Type</label>
        <div class="filter-chips" id="typeFilter">
          <button class="ui-filter-chip active" data-type="all">
            <i class="fa-solid fa-list ui-filter-chip-icon"></i>
            All
          </button>
          <button class="ui-filter-chip" data-type="feature">
            <i class="fa-solid fa-rocket ui-filter-chip-icon"></i>
            Feature
          </button>
          <button class="ui-filter-chip" data-type="bug">
            <i class="fa-solid fa-bug ui-filter-chip-icon"></i>
            Bug
          </button>
          <button class="ui-filter-chip" data-type="chat">
            <i class="fa-solid fa-comments ui-filter-chip-icon"></i>
            Chat
          </button>
          <button class="ui-filter-chip" data-type="revert">
            <i class="fa-solid fa-rotate-left ui-filter-chip-icon"></i>
            Revert
          </button>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Time Range</label>
        <div class="filter-chips" id="timeFilter">
          <button class="ui-filter-chip active" data-time="all">
            <i class="fa-solid fa-list ui-filter-chip-icon"></i>
            All Time
          </button>
          <button class="ui-filter-chip" data-time="today">
            <i class="fa-solid fa-sun ui-filter-chip-icon"></i>
            Today
          </button>
          <button class="ui-filter-chip" data-time="7days">
            <i class="fa-solid fa-calendar-days ui-filter-chip-icon"></i>
            7 Days
          </button>
          <button class="ui-filter-chip" data-time="30days">
            <i class="fa-solid fa-calendar ui-filter-chip-icon"></i>
            30 Days
          </button>
        </div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="timeline-container">
      <div class="ui-timeline" id="historyTimeline">
        <!-- History entries will be rendered here -->
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state ui-empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <h2 class="empty-state-title">No History Found</h2>
      <p class="empty-state-desc">Your actions will appear here as you interact with the dashboard.</p>
    </div>

    <!-- History Details Modal -->
    <div id="historyDetailsModal" class="ui-modal-overlay" style="display: none;">
      <div class="ui-modal" style="max-width: 600px;">
        <div class="ui-modal-header">
          <span class="ui-modal-title">Action Details</span>
          <button class="ui-modal-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="ui-modal-body" id="historyDetailsContent">
          <!-- History details will be rendered here -->
        </div>
        <div class="ui-modal-footer" id="historyDetailsFooter">
          <!-- Revert button will be added here -->
        </div>
      </div>
    </div>
  </div>

  <script src="../components/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
