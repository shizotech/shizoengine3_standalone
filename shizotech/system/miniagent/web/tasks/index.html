<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>miniagent • tasks</title>
  <link rel="stylesheet" href="../components/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <div class="stats" id="stats">connecting…</div>
    <button id="btnNew" class="btn primary">+ New task</button>
  </header>

  <form id="newTask" class="card new-task hidden">
    <input id="taskName" placeholder="Name (optional)" />
    <textarea id="taskGoal" rows="3" placeholder="What should a worker do?"></textarea>
    <div class="row">
      <button type="submit" class="btn primary">Start</button>
      <button type="button" id="btnCancel" class="btn">Cancel</button>
    </div>
  </form>

  <main class="cols">
    <section>
      <h2>Tasks</h2>
      <div id="tasks" class="list"><div class="empty">No tasks yet.</div></div>
    </section>
    <section>
      <h2>Finished tasks</h2>
      <div id="events" class="list"><div class="empty">Nothing finished yet.</div></div>
    </section>
  </main>

  <footer class="hazard-banner" aria-label="Authorized personnel only">
    <span>AUTHORIZED PERSONNEL ONLY</span>
  </footer>

  <script src="../components/nodeapi.js"></script>
  <script src="script.js"></script>
</body>
</html>
