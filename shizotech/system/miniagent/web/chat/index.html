<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShizoGPT • SHIZOTECH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   <link rel="stylesheet" href="style.css" />
   <link rel="stylesheet" href="components/theme.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="logo">S</div>
          <span>Shizo<b>GPT</b></span>
        </div>
        <button id="btnNewChat" class="btn-new-chat">
          <i class="fa-solid fa-plus"></i>
          New Chat
        </button>
      </div>
      <div id="conversationList" class="sidebar-conversations"></div>
      <div class="sidebar-footer">
        <select id="modeSelect" class="mode-select">
          <option value="normal">💬 Normal Chat</option>
          <option value="research">🔍 Deep Research</option>
          <option value="coding">💻 Coding</option>
        </select>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-area">
      <header class="main-header">
        <button id="btnToggleSidebar" class="btn-toggle-sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div id="headerTitle" class="header-title">New Chat</div>
        <div id="statusBadge" class="status-badge">
          <span class="status-dot"></span>
          <span class="status-label">Ready</span>
        </div>
      </header>

      <section id="messages" class="messages">
        <div id="messagesInner" class="messages-inner">
          <div id="emptyState" class="empty-state">
            <div class="empty-icon"><i class="fa-solid fa-bolt"></i></div>
            <h2>How can I help you?</h2>
            <p>Start a conversation by typing a message below. Your chats are saved locally in your browser.</p>
          </div>
        </div>
      </section>

      <section class="composer">
        <div class="composer-inner">
          <textarea id="prompt" rows="1" placeholder="Message ShizoGPT…" aria-label="Prompt input"></textarea>
          <button id="btnSend" class="btn-send" title="Send">
            <i class="fa-solid fa-arrow-up"></i>
          </button>
          <button id="btnStop" class="btn-stop" title="Stop">
            <i class="fa-solid fa-stop"></i>
          </button>
        </div>
      </section>
    </div>

    <!-- Panel Resizer -->
    <div id="panelResizer" class="panel-resizer" style="display:none;"></div>

    <!-- HTML Editor Panel -->
    <aside id="editorPanel" class="editor-panel">
      <div class="editor-panel-header">
        <i class="fa-solid fa-code"></i> Live Preview
        <button id="btnCloseEditor" class="btn-close-editor"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="editor-wrapper">
        <pre id="htmlCode" class="editor-code language-html"></pre>
        <div id="editorResizer" class="editor-resizer"></div>
        <iframe id="htmlPreview" class="editor-preview"></iframe>
      </div>
      <div class="editor-toolbar">
        <button id="btnDesktop" class="active"><i class="fa-solid fa-desktop"></i> Desktop</button>
        <button id="btnMobile"><i class="fa-solid fa-mobile-screen"></i> Mobile</button>
      </div>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
