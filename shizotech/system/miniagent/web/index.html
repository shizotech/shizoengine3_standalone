<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard • ShizoGPT Ecosystem</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="components/ui.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="logo"><i class="fa-solid fa-grid-2"></i></div>
          <span>Dashboard</span>
        </div>
        <button id="btnToggleSidebar" class="btn-toggle-sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
      
      <nav id="dashboardNav" class="dashboard-nav">
        <div class="nav-section-label">
          <i class="fa-solid fa-compass"></i> Navigation
        </div>
        
        <button class="nav-item active" data-module="chat">
          <i class="fa-solid fa-comments"></i>
          <span>Planner Chat</span>
        </button>
		
        <button class="nav-item" data-module="features">
          <i class="fa-solid fa-rocket"></i>
          <span>Features</span>
        </button>
        
        <button class="nav-item" data-module="history">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>History</span>
        </button>   
        
        <button class="nav-item" data-module="settings">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </button>
        
        <div class="nav-section-label">
          <i class="fa-solid fa-cog"></i> Settings
        </div>
        
        <button class="nav-item nav-item-secondary" id="btnClearData">
          <i class="fa-solid fa-trash"></i>
          <span>Clear Data</span>
        </button>
        
        <button class="nav-item nav-item-secondary" id="btnThemeToggle">
          <i class="fa-solid fa-moon"></i>
          <span>Dark Mode</span>
        </button>
        
        <button class="nav-item nav-item-secondary" id="btnWorkMode">
          <i class="fa-solid fa-play"></i>
          <span>Work Mode</span>
        </button>
        
        <button class="nav-item nav-item-secondary" id="btnSecretEgg" style="opacity: 0.5;">
          <i class="fa-solid fa-egg"></i>
          <span>Secret</span>
        </button>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main id="mainContent" class="main-content">
      <!-- Header -->
      <header class="dashboard-header">
        <div class="header-left">
          <button id="btnToggleSidebarMobile" class="btn-toggle-sidebar-mobile">
            <i class="fa-solid fa-bars"></i>
          </button>
          <h1 id="dashboardTitle" class="dashboard-title">Chat</h1>
        </div>
        
        <div class="header-right">
          <div class="user-context">
            <div class="user-avatar">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-info">
              <span class="user-name">User</span>
              <span class="user-role">Admin</span>
            </div>
          </div>
          
          <button id="btnNotifications" class="btn-notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="notification-badge" id="notificationBadge">0</span>
          </button>
        </div>
      </header>

      <!-- Module Container -->
      <div id="moduleContainer" class="module-container">
        <!-- Modules will be injected here -->
        <div id="chatModule" class="module active">
          <iframe id="chatFrame" src="chat/index.html" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
        </div>
        
        <div id="featuresModule" class="module">
          <iframe id="featuresFrame" src="features/index.html" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
        </div>
        
        <div id="historyModule" class="module">
          <iframe id="historyFrame" src="history/index.html" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
        </div>
        
        <div id="settingsModule" class="module">
          <iframe id="settingsFrame" src="settings/index.html" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
        </div>
        
        <div id="cowLaysEggsModule" class="module">
          <iframe id="cowEggFrame" src="" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
        </div>
      </div>
    </main>

    <!-- Overlay for mobile -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    
  </div>

  <script src="components/utils.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
