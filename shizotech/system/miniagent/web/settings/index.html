<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings • ShizoGPT Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../components/ui.css" />
  <link rel="stylesheet" href="../components/theme.css" />
</head>
<body>
  <div class="settings-container">
    <!-- Header -->
    <div class="settings-header">
      <div class="header-content">
        <h1 class="settings-title">
          <i class="fa-solid fa-gear"></i>
          Settings
        </h1>
        <div class="settings-meta">
          Configure dashboard and agent behavior
        </div>
      </div>
      
      <div class="header-actions">
        <button class="ui-btn" id="btnSaveSettings">
          <i class="fa-solid fa-save"></i>
          Save Changes
        </button>
      </div>
    </div>

    <!-- Agent Configuration Section -->
    <div class="settings-section">
      <div class="ui-card">
        <div class="ui-card-header">
          <i class="fa-solid fa-robot"></i>
          <span>Agent Configuration</span>
        </div>
        <div class="ui-card-body">
          <form class="ui-form" id="settingsForm">
            <div class="ui-form-group">
              <label class="ui-form-label">
                <i class="fa-solid fa-users"></i>
                Max Active Agents
              </label>
              <input type="number" class="ui-form-input" id="maxActiveAgents" min="1" max="100" placeholder="5" />
              <p class="ui-form-hint">Maximum number of agents that can be active simultaneously</p>
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">
                <i class="fa-solid fa-clock"></i>
                Check Interval (ms)
              </label>
              <input type="number" class="ui-form-input" id="checkInterval" min="1000" step="500" placeholder="5000" />
              <p class="ui-form-hint">How often agents should check for available work (in milliseconds)</p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Settings Status -->
    <div class="settings-status" id="settingsStatus" style="display: none;">
      <div class="status-content"></div>
    </div>
  </div>

  <script src="../components/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
